name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Force Node.js 24 to avoid deprecation warnings

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.0  # Latest version built for Node.js 24
      
    - name: Set up Python
      uses: actions/setup-python@v5.3.0  # Latest version built for Node.js 24
      with:
        python-version: '3.12'  # Updated to Python 3.12 for better compatibility
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          build-essential \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-17-jdk \
          wget \
          curl
        
    - name: Install Buildozer and dependencies
      run: |
        python3 -m pip install --upgrade pip wheel setuptools
        python3 -m pip install buildozer cython==0.29.36
        
    - name: Set up Android SDK/NDK
      run: |
        # Create Android SDK directory (use sdk directory, not platform)
        mkdir -p $HOME/.buildozer/android/sdk
        
        # Download and extract Android SDK command-line tools with robust retry logic
        echo "📥 Downloading Android SDK command-line tools..."
        
        # Use curl with better error handling and progress tracking
        for attempt in {1..5}; do
          echo "📋 Attempt $attempt/5..."
          
          # Clean up any previous failed downloads
          rm -f commandlinetools-linux-9477386_latest.zip commandlinetools-linux-9477386_latest.zip.part
          
          # Download with curl - resume support, timeout, and progress bar
          if curl -L --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
               --progress-bar \
               -o commandlinetools-linux-9477386_latest.zip \
               "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"; then
            echo "✅ Download completed successfully"
            
            # Verify file size (should be > 100MB)
            file_size=$(stat -c%s "commandlinetools-linux-9477386_latest.zip" 2>/dev/null || stat -f%z "commandlinetools-linux-9477386_latest.zip")
            if [ "$file_size" -gt 100000000 ]; then
              echo "✅ File size check passed: $((file_size/1024/1024)) MB"
              break
            else
              echo "⚠️ File size suspiciously small: $((file_size/1024/1024)) MB"
              if [ $attempt -eq 5 ]; then
                echo "❌ All download attempts failed - file too small"
                exit 1
              fi
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          else
            echo "⚠️ Download failed on attempt $attempt"
            if [ $attempt -eq 5 ]; then
              echo "❌ All download attempts failed"
              exit 1
            fi
            echo "Retrying in 5 seconds..."
            sleep 5
          fi
        done
        
        # Verify download integrity with checksum
        echo "🔍 Verifying download integrity..."
        if [ ! -f "commandlinetools-linux-9477386_latest.zip" ]; then
          echo "❌ Downloaded file not found"
          exit 1
        fi
        
        # Check if file is a valid zip
        echo "📦 Checking zip file integrity..."
        if unzip -tq commandlinetools-linux-9477386_latest.zip > /dev/null 2>&1; then
          echo "✅ Zip file integrity check passed"
        else
          echo "❌ Zip file is corrupted"
          exit 1
        fi
        
        # Extract with verbose output for debugging
        echo "📦 Extracting Android SDK..."
        mkdir -p $HOME/.buildozer/android/sdk/cmdline-tools
        unzip -q commandlinetools-linux-9477386_latest.zip -d $HOME/.buildozer/android/sdk/cmdline-tools
        if [ $? -ne 0 ]; then
          echo "❌ Extraction failed"
          exit 1
        fi
        
        mv $HOME/.buildozer/android/sdk/cmdline-tools/cmdline-tools $HOME/.buildozer/android/sdk/cmdline-tools/latest
        
        # Set environment variables (temporary for SDK installation only)
        # These will be overridden later to point to platform directories
        echo "🔧 Setting temporary environment variables for SDK installation..."
        echo "ANDROID_HOME_TEMP=$HOME/.buildozer/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT_TEMP=$HOME/.buildozer/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME_TEMP=$HOME/.buildozer/android/sdk/ndk/25b" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT_TEMP=$HOME/.buildozer/android/sdk/ndk/25b" >> $GITHUB_ENV
        echo "PATH_TEMP=$PATH:$HOME/.buildozer/android/sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/sdk/platform-tools:$HOME/.buildozer/android/sdk/ndk/25b" >> $GITHUB_ENV
        
        # ACCEPT LICENSES - CRITICAL FIX FOR ALL SDK PACKAGES (PLATFORM-TOOLS + BUILD-TOOLS)
        echo "📝 ACCEPTING ALL ANDROID LICENSES (CRITICAL FOR ALL SDK PACKAGES)..."
        
        # Method 1: Create comprehensive license acceptance files in MULTIPLE locations
        echo "🔧 Creating license acceptance files in ALL possible locations..."
        
        # Location 1: Standard Android SDK license location
        mkdir -p $HOME/.android/licenses
        
        # Location 2: SDK directory itself (some versions look here)
        mkdir -p $HOME/.buildozer/android/sdk/licenses
        
        # ALL known Android SDK license hashes (including platform-tools and build-tools)
        LICENSES="8933bad161af4178b1185d1a37fbf41ea5269c55
d56f5187479451eabf01fb78af6dfcb131a6481e
84831b9409646a918e30573b4ad6d4e7e5c2f256
33b6a2b64607f11b759f320ef9dff4ae5c47d97a
601085b94cd77f0b54ff86406957099ebe79c4d6
24333f8a63b6825ea9c5514f83c2829b004d1fee
d975f751698a77b662f1254ddbeed3901e285f74
56f9970a959b55bae6b6a9855daf3e0ca85e8c6d"
        
        # Create license files in BOTH locations
        echo "$LICENSES" > $HOME/.android/licenses/android-sdk-license
        echo "$LICENSES" > $HOME/.buildozer/android/sdk/licenses/android-sdk-license
        
        # Create specific license files for platform-tools and build-tools
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/licenses/android-sdk-platform-tools-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/sdk/licenses/android-sdk-platform-tools-license
        
        echo -e "d975f751698a77b662f1254ddbeed3901e285f74\n56f9970a959b55bae6b6a9855daf3e0ca85e8c6d" > $HOME/.android/licenses/android-sdk-build-tools-license
        echo -e "d975f751698a77b662f1254ddbeed3901e285f74\n56f9970a959b55bae6b6a9855daf3e0ca85e8c6d" > $HOME/.buildozer/android/sdk/licenses/android-sdk-build-tools-license
        
        # Method 2: Use sdkmanager --licenses with explicit SDK root and aggressive acceptance
        echo "🔧 Using sdkmanager to accept ALL licenses with explicit SDK root..."
        
        # Create a script that automatically accepts ALL licenses
        cat > accept_all_licenses.sh << 'EOF'
#!/bin/bash
# Auto-accept all Android SDK licenses
for i in {1..20}; do
  echo "y"
  sleep 0.1
done
EOF
        chmod +x accept_all_licenses.sh
        
        # Run license acceptance with SDK root specified - FIXED: Use yes command for proper stdin piping
        echo "📋 Running license acceptance for SDK root: $HOME/.buildozer/android/sdk"
        yes | $HOME/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$HOME/.buildozer/android/sdk 2>&1 | tee license_accept.log || {
          echo "⚠️ License acceptance had issues, but continuing..."
        }
        
        # Method 3: Accept licenses for EACH package individually BEFORE installation
        echo "🔧 ACCEPTING LICENSES FOR EACH PACKAGE INDIVIDUALLY..."
        
        # Function to accept license for a specific package - FIXED: Use yes command
        accept_license_for_package() {
          local package="$1"
          echo "📋 Accepting license for: $package"
          yes | $HOME/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$HOME/.buildozer/android/sdk 2>&1 | grep -i "$package" || true
        }
        
        # Accept licenses for all required packages
        accept_license_for_package "platform-tools"
        accept_license_for_package "build-tools"
        
        # CRITICAL: After SDK installation, accept license specifically for Build-Tools 37.0.0
        echo "🔧 CRITICAL: Accepting license specifically for Build-Tools 37.0.0..."
        echo "y" | $HOME/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$HOME/.buildozer/android/sdk 2>&1 | grep -i "build-tools" || true
        
        # Verify licenses were accepted
        echo "🔍 Verifying license acceptance..."
        echo "📋 License files in $HOME/.android/licenses/:"
        ls -la $HOME/.android/licenses/ 2>/dev/null || echo "⚠️ No license directory found"
        
        echo "📋 License files in $HOME/.buildozer/android/sdk/licenses/:"
        ls -la $HOME/.buildozer/android/sdk/licenses/ 2>/dev/null || echo "⚠️ No SDK license directory found"
        
        # Show license file contents
        if [ -f "$HOME/.android/licenses/android-sdk-license" ]; then
          echo "✅ License file created: $HOME/.android/licenses/android-sdk-license"
          echo "📊 License count: $(wc -l < $HOME/.android/licenses/android-sdk-license)"
        fi
        
        # Final verification: Check if sdkmanager can run without license prompts
        echo "🔍 Testing license acceptance with sdkmanager list..."
        $HOME/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager --list --sdk_root=$HOME/.buildozer/android/sdk 2>&1 | head -20
        
        # Install required SDK packages with progress tracking (using temporary SDK location)
        # CRITICAL: Use yes command to automatically accept ALL licenses during installation
        # IMPORTANT: Do NOT install NDK via sdkmanager - it will be downloaded by fix script to platform directory
        echo "📦 Installing Android SDK packages (this may take several minutes)..."
        echo "🔧 Using 'yes' to automatically accept ALL licenses during installation..."
        echo "📋 Note: NDK will be downloaded separately by fix script to platform directory"
        yes | $HOME/.buildozer/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/sdk \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.0" \
          "build-tools;37.0.0" 2>&1 | tee sdk_install.log
        
        echo "✅ Android SDK setup completed (NDK will be downloaded separately)"
        echo "SDK installation log summary:"
        tail -10 sdk_install.log
          
    - name: Pre-download Android NDK to avoid Buildozer download errors
      run: |
        echo "📥 NDK pre-download configured - will be executed by fix script"
        echo "🔧 The fix_buildozer_platform_directories.sh script contains robust NDK pre-download"
        echo "📋 NDK will be downloaded to: $HOME/.buildozer/android/platform/android-sdk/ndk/25b"
        
    - name: Configure Buildozer platform directories (CRITICAL)
      run: |
        # CRITICAL: Create platform directories BEFORE any Buildozer commands
        # This prevents Buildozer from attempting to download SDK/NDK
        echo "🔧 CRITICAL: Configuring Buildozer platform directories..."
        echo "This must run BEFORE any Buildozer commands to prevent downloads"
        
        # Run the platform directory fix immediately after SDK/NDK setup
        echo "📁 Running platform directory fix..."
        chmod +x fix_buildozer_platform_directories.sh
        ./fix_buildozer_platform_directories.sh
        
        # Verify the platform directories were created
        echo "🔍 Verifying platform directory structure..."
        echo "Platform directory:"
        ls -la $HOME/.buildozer/android/platform/
        
        echo "Platform/android-ndk directory:"
        ls -la $HOME/.buildozer/android/platform/android-ndk/
        
        echo "Platform/android-ndk/android-ndk-r25b directory:"
        ls -la $HOME/.buildozer/android/platform/android-ndk/android-ndk-r25b/ | head -5
        
        # Set environment variables to point to our pre-configured directories
        echo "🔧 Setting environment variables for Buildozer..."
        echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
        
    - name: Verify Buildozer environment
      run: |
        # Environment variables are already set by the platform directory configuration step
        # Just verify they are properly set for Buildozer
        echo "🔧 Verifying Buildozer environment variables..."
        
        # Verify environment variables are set (from platform directory configuration)
        echo "📋 Environment verification:"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
        
        # Update PATH to include platform directories (not the old sdk directories)
        echo "🔧 Updating PATH with platform directories..."
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_HOME"
        echo "PATH includes platform directories:"
        echo "$PATH" | tr ':' '\n' | grep -E "(platform|android)" || echo "⚠️ Platform paths not found in PATH"
        
        # Check if Buildozer can find our SDK/NDK
        echo "🔍 Checking Buildozer configuration..."
        echo "Testing Buildozer dry-run to verify SDK/NDK detection..."
        buildozer android debug --dry-run 2>&1 | grep -E "(SDK|NDK|sdk|ndk|platform)" | head -10 || echo "⚠️ Dry-run may fail, continuing..."
        
    - name: Build APK with Buildozer
      run: |
        # IMPORTANT: DO NOT run clean command before platform directories are set up
        # The clean command triggers Buildozer's internal setup which downloads SDK/NDK
        # Instead, we'll rely on the platform directories already created
        
        # Create .buildozer directory if it doesn't exist
        mkdir -p .buildozer
        
        # Use the platform directory paths (already set in environment from previous step)
        echo "🔧 Using platform directory paths for Buildozer (already set in environment)..."
        echo "📋 Current environment variables:"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
        
        # Verify Buildozer can see our SDK/NDK in platform directories
        echo "🔍 Verifying platform SDK/NDK locations..."
        if [ -d "$ANDROID_HOME" ]; then
          echo "✅ ANDROID_HOME (platform) exists: $ANDROID_HOME"
          echo "📊 Platform SDK contents:"
          ls -la "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || echo "⚠️ cmdline-tools not found in platform"
          
          # CRITICAL: License acceptance already handled by fix script
          echo "🔧 License acceptance already handled by fix_buildozer_platform_directories.sh"
          echo "📝 The fix script's accept_buildozer_licenses() function creates comprehensive license files"
          
          # Verify license files exist in platform directory
          echo "🔍 Verifying license files in platform/android-sdk/licenses..."
          if [ -d "$ANDROID_HOME/licenses" ]; then
            echo "✅ License directory exists in platform/android-sdk"
            echo "📋 License files:"
            ls -la "$ANDROID_HOME/licenses/" 2>/dev/null || echo "⚠️ No license files found"
          else
            echo "⚠️ License directory not found in platform/android-sdk"
            echo "📝 Creating license directory..."
            mkdir -p "$ANDROID_HOME/licenses"
          fi
        else
          echo "❌ ANDROID_HOME (platform) not found: $ANDROID_HOME"
          echo "📁 Expected path: $HOME/.buildozer/android/platform/android-sdk"
          echo "📁 Checking original SDK location..."
          if [ -d "$HOME/.buildozer/android/sdk" ]; then
            echo "✅ Original SDK found, copying to platform..."
            mkdir -p "$ANDROID_HOME"
            cp -r "$HOME/.buildozer/android/sdk/*" "$ANDROID_HOME/" 2>/dev/null || true
          fi
        fi
        
        if [ -d "$ANDROID_NDK_HOME" ]; then
          echo "✅ ANDROID_NDK_HOME (platform) exists: $ANDROID_NDK_HOME"
          echo "📊 Platform NDK contents:"
          ls -la "$ANDROID_NDK_HOME/" | head -10
        else
          echo "❌ ANDROID_NDK_HOME (platform) not found: $ANDROID_NDK_HOME"
          echo "📁 Expected path: $HOME/.buildozer/android/platform/android-ndk/android-ndk-r25b"
          echo "📁 Checking original NDK location..."
          if [ -d "$HOME/.buildozer/android/sdk/ndk/25b" ]; then
            echo "✅ Original NDK found, copying to platform..."
            mkdir -p "$ANDROID_NDK_HOME"
            cp -r "$HOME/.buildozer/android/sdk/ndk/25b/*" "$ANDROID_NDK_HOME/" 2>/dev/null || true
          fi
        fi
        
        # Build debug APK with increased timeout (45 minutes for first build)
        echo "🔨 Starting APK build (this may take 30-45 minutes)..."
        echo "Buildozer command: buildozer -v android debug"
        echo "Using SDK (platform): $ANDROID_HOME"
        echo "Using NDK (platform): $ANDROID_NDK_HOME"
        echo "📋 Platform directory verification:"
        echo "   Platform SDK: $HOME/.buildozer/android/platform/android-sdk"
        echo "   Platform NDK: $HOME/.buildozer/android/platform/android-ndk/android-ndk-r25b"
        echo "   Environment: ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        
        # Run build with detailed logging and continue on error
        timeout 2700 buildozer -v android debug 2>&1 | tee build.log || {
          echo "⚠️ Build failed or timed out, checking logs..."
          echo "Build exit code: $?"
        }
        
        # Check if APK was created (handle glob patterns correctly)
        echo "📁 Checking for APK files..."
        if ls bin/*.apk 2>/dev/null; then
          echo "✅ APK created successfully!"
          echo "APK files found:"
          ls -la bin/
          echo "APK size:"
          du -h bin/*.apk
        else
          echo "❌ APK not found in bin/, checking alternative locations..."
          echo "Current directory:"
          pwd
          echo "Directory contents:"
          ls -la
          
          # Check Buildozer's default output locations
          echo "🔍 Searching for APK files in common locations..."
          find . -name "*.apk" -type f 2>/dev/null | head -10
          find ~/.buildozer -name "*.apk" -type f 2>/dev/null | head -10
          
          echo "📋 Buildozer log tail:"
          tail -100 build.log 2>/dev/null | grep -E "(APK|apk|build|error|success)" || echo "No build.log found"
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.5.0  # Latest version built for Node.js 24
      with:
        name: bluetooth-security-app
        path: |
          bin/*.apk
          .buildozer/android/app/build/outputs/apk/debug/*.apk
          $HOME/.buildozer/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 7
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4.5.0  # Latest version built for Node.js 24
      with:
        name: build-logs
        path: |
          .buildozer/**/*
          buildozer.spec
          buildozer.log
          *.log
        if-no-files-found: warn
        retention-days: 7