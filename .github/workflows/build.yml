name: Build Android APK (Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Force Node.js 24 to avoid deprecation warnings

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.0  # Latest version built for Node.js 24
      
    - name: Set up Python
      uses: actions/setup-python@v5.3.0  # Latest version built for Node.js 24
      with:
        python-version: '3.12'  # Updated to Python 3.12 for better compatibility
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          build-essential \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          python3-venv \
          zip \
          unzip \
          openjdk-11-jdk \
          wget \
          curl \
          expect  # For automated license acceptance
        
    - name: Set Java 11 as default (CRITICAL for Android SDK compatibility)
      run: |
        echo "🔧 Setting Java 11 as default for Android SDK compatibility..."
        # Find Java 11 installation
        JAVA_11_PATH=$(update-alternatives --list java | grep "11" | head -1)
        if [ -n "$JAVA_11_PATH" ]; then
          echo "✅ Found Java 11 at: $JAVA_11_PATH"
          JAVA_HOME=$(dirname $(dirname "$JAVA_11_PATH"))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "✅ Set JAVA_HOME to: $JAVA_HOME"
        else
          echo "⚠️ Java 11 not found via update-alternatives, trying default location..."
          if [ -d "/usr/lib/jvm/java-11-openjdk-amd64" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
            echo "✅ Set JAVA_HOME to: /usr/lib/jvm/java-11-openjdk-amd64"
          else
            echo "❌ Java 11 not found! The build may fail due to Java compatibility issues."
          fi
        fi
        
    - name: Install Buildozer and dependencies
      run: |
        python3 -m pip install --upgrade pip wheel setuptools
        python3 -m pip install buildozer cython==0.29.36
        
    - name: Set up complete Android SDK with actions/setup-android (CRITICAL FIX)
      uses: android-actions/setup-android@v4.0.1
      with:
        # Install complete SDK toolchain including build-tools;37.0.0
        # CRITICAL: Use exact NDK version 25.1.8937393 to match Buildozer expectations
        packages: |
          platform-tools
          platforms;android-33
          build-tools;33.0.0
          build-tools;37.0.0
          ndk;25.1.8937393
          cmdline-tools;latest
          tools
        accept-android-sdk-licenses: true  # Correct parameter name for v4.0.1
        
    - name: Configure Android environment variables for Buildozer
      run: |
        # Set environment variables to point to the SDK installed by actions/setup-android
        # This ensures Buildozer finds a complete SDK toolchain
        echo "🔧 Setting Android environment variables for Buildozer..."
        
        # First, check where actions/setup-android installed the SDK
        echo "📋 Checking for Android SDK installation..."
        
        # Common SDK locations to check
        SDK_LOCATIONS=(
          "$HOME/android-sdk"
          "$HOME/.android/sdk"
          "/usr/local/lib/android/sdk"
          "/opt/android/sdk"
          "$RUNNER_WORKSPACE/android-sdk"
        )
        
        ANDROID_HOME=""
        for location in "${SDK_LOCATIONS[@]}"; do
          if [ -d "$location" ]; then
            echo "✅ Found Android SDK at: $location"
            ANDROID_HOME="$location"
            break
          fi
        done
        
        # If not found, check for environment variable set by actions/setup-android
        if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
          echo "✅ Using ANDROID_SDK_ROOT from environment: $ANDROID_SDK_ROOT"
          ANDROID_HOME="$ANDROID_SDK_ROOT"
        fi
        
        # If still not found, use default location
        if [ -z "$ANDROID_HOME" ]; then
          echo "⚠️ SDK not found in common locations, using default: $HOME/android-sdk"
          ANDROID_HOME="$HOME/android-sdk"
          # Create directory if it doesn't exist
          mkdir -p "$ANDROID_HOME"
        fi
        
        ANDROID_SDK_ROOT="$ANDROID_HOME"
        
        # NDK location from actions/setup-android (25.1.8937393)
        # Check common NDK locations
        NDK_LOCATIONS=(
          "$ANDROID_HOME/ndk/25.1.8937393"
          "$ANDROID_HOME/ndk-bundle"
          "/usr/local/lib/android/sdk/ndk/25.1.8937393"
          "$HOME/.android/ndk/25.1.8937393"
        )
        
        ANDROID_NDK_HOME=""
        for location in "${NDK_LOCATIONS[@]}"; do
          if [ -d "$location" ]; then
            echo "✅ Found Android NDK at: $location"
            ANDROID_NDK_HOME="$location"
            break
          fi
        done
        
        # If not found, check for NDK environment variable
        if [ -z "$ANDROID_NDK_HOME" ] && [ -n "$ANDROID_NDK_ROOT" ]; then
          echo "✅ Using ANDROID_NDK_ROOT from environment: $ANDROID_NDK_ROOT"
          ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
        fi
        
        # If still not found, use expected location
        if [ -z "$ANDROID_NDK_HOME" ]; then
          echo "⚠️ NDK not found, using expected location: $ANDROID_HOME/ndk/25.1.8937393"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.1.8937393"
        fi
        
        ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        
        # Update PATH
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_HOME" >> $GITHUB_ENV
        
        echo "✅ Environment variables set:"
        echo "   ANDROID_HOME: $ANDROID_HOME"
        echo "   ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "   SDK contents:"
        ls -la "$ANDROID_HOME/" 2>/dev/null | head -5 || echo "⚠️ Cannot list SDK directory"
        
    - name: Create sdkmanager symlink for Buildozer (CRITICAL FIX)
      run: |
        echo "🔧 Creating sdkmanager symlink for Buildozer..."
        
        # Create Buildozer platform directory structure
        mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
        
        # Check if sdkmanager exists in cmdline-tools
        if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "✅ Found sdkmanager at: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Create symlink for Buildozer's expected path
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo "✅ Created sdkmanager symlink"
        else
          echo "⚠️ sdkmanager not found in cmdline-tools, searching..."
          # Search for sdkmanager
          find / -name "sdkmanager" -type f 2>/dev/null | head -10 || true
          echo "Creating a dummy sdkmanager script as fallback..."
          # Create a minimal sdkmanager wrapper without heredoc
          echo '#!/bin/bash' > "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo 'echo "WARNING: Dummy sdkmanager script - real sdkmanager not found"' >> "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo 'echo "This is a fallback for Buildozer'\''s path expectations"' >> "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo 'echo "Arguments: $@"' >> "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo 'echo "Exiting with success code to allow Buildozer to continue"' >> "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          echo 'exit 0' >> "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          chmod +x "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
        fi
        
