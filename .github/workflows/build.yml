    - name: Create Buildozer platform directories with NDK bridge
      run: |
        # Create Buildozer's expected platform directory structure
        # This bridges the gap between actions/setup-android location and Buildozer expectations
        echo "🔧 Creating Buildozer platform directories..."
        
        # Create platform directory
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        
        # Copy SDK contents to platform directory (symlink to avoid duplication)
        echo "📋 Creating SDK symlink in platform directory..."
        ln -sf "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk" || {
          echo "⚠️ Symlink failed, copying instead..."
          cp -r "$ANDROID_HOME/." "$HOME/.buildozer/android/platform/android-sdk/" 2>/dev/null || true
        }
        
        # Create NDK bridge: SDK Manager's "25b" → Buildozer's expected "25.1.8937393"
        echo "🔧 Creating NDK naming bridge..."
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/ndk
        
        # Create symlink for NDK bridge
        ln -sf "$ANDROID_NDK_HOME" "$HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393" || {
          echo "⚠️ NDK symlink failed, creating directory bridge..."
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393"
          cp -r "$ANDROID_NDK_HOME/." "$HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393/" 2>/dev/null || true
        }
        
        # Set Buildozer environment variables to use platform directory
        echo "🔧 Setting Buildozer environment variables to platform directory..."
        echo "BUILDOZER_ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "BUILDOZER_ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393" >> $GITHUB_ENV
        
        echo "✅ Platform directories created:"
        echo "   SDK: $HOME/.buildozer/android/platform/android-sdk"
        echo "   NDK Bridge: $HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393"
        echo "   Actual NDK: $ANDROID_NDK_HOME"
        
    - name: Build APK with Buildozer using complete SDK
      run: |
        echo "🔨 Starting APK build with complete SDK toolchain..."
        
        # Use Buildozer environment variables
        BUILDOZER_SDK_DIR="$BUILDOZER_ANDROID_HOME"
        BUILDOZER_NDK_DIR="$BUILDOZER_ANDROID_NDK_HOME"
        
        echo "📋 Build configuration:"
        echo "   SDK Directory: $BUILDOZER_SDK_DIR"
        echo "   NDK Directory: $BUILDOZER_NDK_DIR"
        echo "   Actual SDK: $ANDROID_HOME"
        echo "   Actual NDK: $ANDROID_NDK_HOME"
        
        # Verify Buildozer can see our SDK/NDK
        echo "🔍 Verifying Buildozer can access SDK/NDK..."
        if [ ! -d "$BUILDOZER_SDK_DIR/build-tools/37.0.0" ]; then
          echo "❌ CRITICAL: Buildozer SDK directory missing build-tools/37.0.0"
          echo "📋 Creating direct symlink..."
          mkdir -p "$BUILDOZER_SDK_DIR/build-tools"
          ln -sf "$ANDROID_HOME/build-tools/37.0.0" "$BUILDOZER_SDK_DIR/build-tools/37.0.0"
        fi
        
        if [ ! -d "$BUILDOZER_NDK_DIR" ]; then
          echo "❌ CRITICAL: Buildozer NDK directory not found"
          echo "📋 Creating direct symlink..."
          mkdir -p "$(dirname "$BUILDOZER_NDK_DIR")"
          ln -sf "$ANDROID_NDK_HOME" "$BUILDOZER_NDK_DIR"
        fi
        
        # Build with explicit SDK/NDK directories to prevent downloads
        echo "🔧 Building APK with explicit SDK/NDK directories..."
        timeout 2700 buildozer -v android debug \
          --sdk-dir="$BUILDOZER_SDK_DIR" \
          --ndk-dir="$BUILDOZER_NDK_DIR" \
          2>&1 | tee build.log || {
          echo "⚠️ Build failed or timed out, checking logs..."
          echo "Build exit code: $?"
        }
        
        # Check for APK
        echo "📁 Checking for APK files..."
        if ls bin/*.apk 2>/dev/null; then
          echo "✅ APK created successfully!"
          echo "APK files:"
          ls -la bin/
        else
          echo "❌ APK not found, checking logs..."
          tail -100 build.log 2>/dev/null | grep -E "(error|fail|success|APK)" || echo "No relevant log entries"
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.5.0
      with:
        name: bluetooth-security-app
        path: |
          bin/*.apk
          .buildozer/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 7
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4.5.0
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/**/*
        if-no-files-found: warn
        retention-days: 7